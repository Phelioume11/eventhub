# Environnement de DEV : docker compose up --build
services:
  api:
    build:
      context: .
      target: dev
    container_name: eventhub-api
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    volumes:
      - .:/app # code source monté -> hot-reload
      - /app/node_modules # volume anonyme : garde les node_modules de l'image
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: eventhub-db
    env_file: .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data # données persistées
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  adminer:
    image: adminer
    container_name: eventhub-adminer
    ports:
      - '8080:8080'
    depends_on:
      - db

volumes:
  pgdata:
